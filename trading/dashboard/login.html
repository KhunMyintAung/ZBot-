%22%20width%3D%2222%22%20height%3D%2284%22%20rx%3D%226%22%20fill%3D%22%230ecb81%22%2F%3E%20%3Crect%20x%3D%22552%22%20y%3D%22734%22%20width%3D%2222%22%20height%3D%2296%22%20rx%3D%226%22%20fill%3D%22%230ecb81%22%2F%3E%20%3Crect%20x%3D%22602%22%20y%3D%22756%22%20width%3D%2222%22%20height%3D%2274%22%20rx%3D%226%22%20fill%3D%22%23f6465d%22%2F%3E%20%3Crect%20x%3D%22652%22%20y%3D%22720%22%20width%3D%2222%22%20height%3D%22110%22%20rx%3D%226%22%20fill%3D%22%230ecb81%22%2F%3E%20%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root { color-scheme: dark; --page: #0b0e11; --surface: #181a20; --text: #eaecef; --text-2: #b7bdc6;
  --border: #2b3139; --accent: #fcd535; --critical: #f6465d; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Myanmar Text", sans-serif; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--text-2); font-size: 13.5px; }
input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--text); }
button { width: 100%; margin-top: 12px; font: inherit; font-weight: 650; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #181a20; cursor: pointer; }
button:disabled { opacity: 0.6; }
.err { color: var(--critical); font-size: 13px; min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <div style="text-align:center;margin-bottom:6px"><svg width="64" height="71" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="200 160 624 690"><rect x="200" y="160" width="624" height="690" rx="120" fill="#0b0e11"/> <g transform="translate(0 0) scale(1)"> <line x1="512" y1="300" x2="512" y2="222" stroke="#fcd535" stroke-width="30" stroke-linecap="round"/> <circle cx="512" cy="200" r="34" fill="#fcd535"/> <rect x="226" y="438" width="34" height="150" rx="17" fill="#fcd535"/> <rect x="764" y="438" width="34" height="150" rx="17" fill="#fcd535"/> <rect x="270" y="300" width="484" height="430" rx="110" fill="#181a20" stroke="#fcd535" stroke-width="30"/> <g stroke-linecap="round" stroke-linejoin="round" fill="none"> <polyline points="356,410 640,410 366,624 532,624" stroke="#fcd535" stroke-width="58"/> <line x1="532" y1="624" x2="636" y2="520" stroke="#0ecb81" stroke-width="52"/> <polygon points="690,466 676,580 576,480" fill="#0ecb81" stroke="#0ecb81" stroke-width="18"/> </g> <rect x="352" y="772" width="22" height="58" rx="6" fill="#f6465d"/> <rect x="402" y="760" width="22" height="70" rx="6" fill="#0ecb81"/> <rect x="452" y="782" width="22" height="48" rx="6" fill="#f6465d"/> <rect x="502" y="746" width="22" height="84" rx="6" fill="#0ecb81"/> <rect x="552" y="734" width="22" height="96" rx="6" fill="#0ecb81"/> <rect x="602" y="756" width="22" height="74" rx="6" fill="#f6465d"/> <rect x="652" y="720" width="22" height="110" rx="6" fill="#0ecb81"/> </g></svg></div>
  <h1>zBOT Trader</h1>
  <p>Dashboard Password ကို ထည့်ပါ</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <button id="b">Login</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json', 'x-zbot': '1' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const j = await r.json();
    if (j.ok) location.href = '/';
    else e.textContent = j.error;
  } catch (err) { e.textContent = err.message; }
  b.disabled = false;
});
</script>
</body>
</html>
